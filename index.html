<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¿Quieres ser mi San Valentín?</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* CARTA */
        .envelope {
            width: 200px;
            height: 120px;
            margin: 0 auto 20px;
            background: #ff4d6d;
            position: relative;
            cursor: pointer;
            border-radius: 0 0 10px 10px;
        }

        .flap {
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 70px solid #ff758c;
            position: absolute;
            top: -70px;
            left: 0;
            transition: transform 1s;
            transform-origin: bottom;
        }

        .open .flap {
            transform: rotateX(180deg);
        }

        .letter-text {
            margin-top: 15px;
            font-size: 16px;
            color: #fff;
        }

        /* CONTENIDO */
        .content {
            display: none;
        }

        h1 {
            color: #ff4d6d;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 12px 22px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.1);
        }

        .yes {
            background-color: #ff4d6d;
            color: white;
        }

        .no {
            background-color: #ccc;
            color: #333;
        }
    </style>
</head>
<body>

<div class="card">

    <!-- CARTA -->
    <div class="envelope" onclick="openLetter()" id="envelope">
        <div class="flap"></div>
        <div class="letter-text">💌 Ábreme</div>
    </div>

    <!-- CONTENIDO -->
    <div class="content" id="content">
        <h1>💖 Invitación Especial 💖</h1>
        <p>He estado pensando en esto…</p>
        <p>¿Quieres ser mi <strong>San Valentín</strong>? 🌹</p>

        <div class="buttons">
            <button class="yes" onclick="aceptar()">Sí 💘</button>
            <button class="no" onclick="rechazar()">No 😅</button>
        </div>
    </div>

</div>

<script>
    function openLetter() {
        document.getElementById("envelope").classList.add("open");

        setTimeout(() => {
            document.getElementById("envelope").style.display = "none";
            document.getElementById("content").style.display = "block";
        }, 1000);
    }

    function aceptar() {
        alert("¡Sabía que dirías que sí! te amo mi kris 💕🥰");
    }

    function rechazar() {
        alert("Piénsalo otra vez 😏💖");
        location.reload();
    }
</script>

</body>
</html>
