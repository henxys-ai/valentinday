<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¿Quieres ser mi San Valentín?</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 {
            color: #ff4d6d;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background-color: #ff4d6d;
            color: white;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>💖 Invitación Especial 💖</h1>
        <p>
            Desde hace un tiempo quería decirte algo importante…
        </p>
        <p>
            ¿Te gustaría ser mi <strong>San Valentín</strong> este 14 de febrero? 🌹
        </p>
        <button onclick="alert('¡Sabía que dirías que sí! 💕')">
            Sí, acepto 💘
        </button>
    </div>

</body>
</html>
